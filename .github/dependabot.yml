version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      time: "04:00"
    # let a release settle before it is auto-merged (security updates are exempt)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "zone.js"
          - "rxjs"
          - "tslib"
        update-types:
        - "major"
        - "minor"
        - "patch"
      typescript-eslint:
        applies-to: version-updates
        patterns:
        - "@typescript-eslint*"
        update-types:
        - "major"
        - "minor"
        - "patch"
      vitest:
        # vitest and @vitest/coverage-v8 pin each other via an exact peer
        # dependency, so they only install if they are bumped together
        applies-to: version-updates
        patterns:
        - "vitest"
        - "@vitest/*"
        update-types:
        - "major"
        - "minor"
        - "patch"
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
      time: "04:00"
    # let a release settle before it is auto-merged (security updates are exempt)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "04:00"
    # let a release settle before it is auto-merged (security updates are exempt)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    # the only Dockerfile lives in /frontend; a bare "/" scans nothing
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: weekly
      time: "04:00"
    # let a release settle before it is auto-merged (security updates are exempt)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
