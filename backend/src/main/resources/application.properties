application.fake.hitobito.enable=false

application.hitobito.group.id=1
application.hitobito.instance=db.cevi.ch
application.hitobito.api.token.file=***

# Keep this file pure ASCII: Spring Boot reads .properties as ISO-8859-1, so a
# literal umlaut breaks the group matching as soon as an editor saves the file as
# UTF-8. Write non-ASCII characters as \uXXXX escapes (\u00FC = u-umlaut).
application.event.groups.include=FG YWCA,Fachgruppen,Cevi Schweiz,Cevi Region Z\u00FCrich,Fachgruppe International,Cevi Familie-F\u00FC\u00FCr
application.course.groups.include=Cevi Schweiz,Cevi Region Z\u00FCrich,Externe Kurse,Cevi Region Bern,Cevi Alpin,Cevi Regionalverband AGSOLUZG, Cevi Region Winterthur-Schaffhausen,Cevi Ostschweiz

server.tomcat.threads.max=20

logging.level.ch.cevi.db.adapter = DEBUG
